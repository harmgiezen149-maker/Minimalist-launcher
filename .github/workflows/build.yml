name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job below may write, and it never
# runs Gradle or any third-party build code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest # Android SDK preinstalled
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # the open-source cache, not the proprietary one

      - name: Code style (ktlint, detekt)
        run: scripts/check-style.sh

      - name: Lint, test with coverage and build the release APK
        run: ./gradlew --no-daemon lint createDebugUnitTestCoverageReport assembleRelease

      - name: Lint findings
        if: always()
        run: |
          reports=$(find app/build -name 'lint-results*.txt' 2>/dev/null)
          if [ -n "$reports" ]; then cat $reports; else echo "No lint report."; fi

      - name: Coverage summary
        if: always()
        run: |
          report=app/build/reports/coverage/test/debug/report.xml
          if [ -f "$report" ]; then scripts/coverage-summary.py "$report" >>"$GITHUB_STEP_SUMMARY"; fi

      # Exercises the exact signing path of the publish job with a throwaway
      # key, so a broken script shows up here and not on release day.
      - name: Check the signing scripts with a throwaway key
        run: |
          SIGNING_PASSPHRASE=$(openssl rand -base64 32)
          echo "::add-mask::$SIGNING_PASSPHRASE"
          export SIGNING_PASSPHRASE
          scripts/signing/create-key.sh "$RUNNER_TEMP/throwaway-key"
          scripts/signing/sign-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/throwaway-signed.apk" "$RUNNER_TEMP/throwaway-key"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports
          path: app/build/reports
          retention-days: 14

  # Day-to-day paths on an emulated phone, with Espresso's accessibility
  # checks. Kept apart from publishing: an emulator on a shared runner can
  # stall for reasons that have nothing to do with the app.
  smoke-test:
    name: Emulator smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-reports
          path: app/build/reports/androidTests
          retention-days: 14

  # Signs and publishes builds of main only. Workflow artifacts need a GitHub
  # login to download, so the APK goes to a rolling release whose link works
  # signed out and always points at the newest build.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-unsigned

      - name: Sign
        id: sign
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ] || [ ! -f keystore/release.p12.gpg ]; then
            echo "::warning::Not published: the signing key is not set up yet (see docs/JOUW-TAKEN.md)."
            echo "Not published: the signing key is not set up yet. See docs/JOUW-TAKEN.md." >>"$GITHUB_STEP_SUMMARY"
            echo "ready=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/signing/sign-apk.sh app-release-unsigned.apk minimalist-launcher.apk keystore
          echo "ready=true" >>"$GITHUB_OUTPUT"

      - name: Publish to the rolling release
        if: steps.sign.outputs.ready == 'true'
        run: |
          # Download scanners like to park a .apk at 99% while inspecting it,
          # so the same build also ships zipped: not an installable package,
          # so it comes through untouched.
          zip -q minimalist-launcher-apk.zip minimalist-launcher.apk
          if gh release view latest >/dev/null 2>&1; then
            # Point the tag at the commit this APK was built from.
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create latest --target "$GITHUB_SHA" --title "Latest build" --notes "Automatic build"
          fi
          gh release upload latest minimalist-launcher.apk minimalist-launcher-apk.zip --clobber
          # Size and checksum make a stalled, partial download recognisable.
          cat >notes.md <<NOTES
          Build ${GITHUB_RUN_NUMBER} (version 1.${GITHUB_RUN_NUMBER}) of ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC

          | file | bytes |
          | --- | --- |
          | minimalist-launcher.apk | $(stat -c%s minimalist-launcher.apk) |
          | minimalist-launcher-apk.zip | $(stat -c%s minimalist-launcher-apk.zip) |

          sha256 of the APK: $(sha256sum minimalist-launcher.apk | cut -d' ' -f1)

          Signing certificate SHA-256: $(cat keystore/release-cert.sha256)
          NOTES
          # Not a prerelease: that keeps /releases/latest/ working and puts the
          # download on the repository's front page.
          gh release edit latest --prerelease=false --notes-file notes.md
